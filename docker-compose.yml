# Local dev / plain-VPS deployment. Hamravesh deploys the same Dockerfile as separate apps (api, web).
#   docker compose up -d --build
# The browser only talks to `web`; it proxies /api/* to `api` (same origin, so cookies just work).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xadboom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xadboom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xadboom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xadboom}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # one-off: docker compose run --rm seed   (sample catalogue + admin user)
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: migrate
    command: ["pnpm", "seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xadboom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xadboom}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@xadboom.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xadboom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xadboom}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      API_PORT: 4000
      # set to "false" only when serving over plain http (e.g. local test); production should be https
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
